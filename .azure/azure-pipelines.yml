# ============================================================
# Mobile Test Automation — Azure DevOps CI Pipeline
# WebdriverIO + Appium + XCUITest + UIAutomator2 on TestMu
#
# Triggers:
#   - PR into main/develop
#   - Manual run (with platform + suite parameters)
#
# Stages:
#   1. Setup        — Install dependencies, validate env
#   2. PrepareApps  — Download from Firebase, upload to TestMu
#   3. TestAndroid  — Run Android tests on TestMu
#   4. TestiOS      — Run iOS tests on TestMu
#   5. Report       — Publish Allure reports as pipeline artifact
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - tests/**
      - src/**
      - config/**
      - scripts/**
      - package.json

pr:
  branches:
    include:
      - main
      - develop

parameters:
  - name: platform
    displayName: 'Platform to test'
    type: string
    default: both
    values:
      - android
      - ios
      - both

  - name: suite
    displayName: 'Test suite'
    type: string
    default: regression
    values:
      - regression
      - smoke
      - sanity

  - name: skipAppPrep
    displayName: 'Skip app download/upload (use existing TestMu URLs)'
    type: boolean
    default: false

variables:
  - group: mobile-test-secrets           # Variable group in Azure DevOps — stores all secrets
  - name: NODE_VERSION
    value: '20.x'
  - name: PNPM_VERSION
    value: '9.15.0'
  - name: BUILD_NAME
    value: '$(Build.DefinitionName) #$(Build.BuildNumber)'
  - name: ALLURE_RESULTS_DIR
    value: '$(Build.SourcesDirectory)/allure-results'
  - name: ALLURE_REPORT_DIR
    value: '$(Build.StagingDirectory)/allure-report'

# ── Stage 1: Setup & Validate ─────────────────────────────────────────────────
stages:
  - stage: Setup
    displayName: 'Setup & Validate'
    jobs:
      - job: InstallDeps
        displayName: 'Install Dependencies'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js $(NODE_VERSION)'

          - script: npm install -g pnpm@$(PNPM_VERSION)
            displayName: 'Install pnpm'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Cache pnpm store'

          - script: pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Set pnpm store path'

          - script: pnpm install --frozen-lockfile
            displayName: 'pnpm install'

          - script: pnpm run typecheck
            displayName: 'TypeScript type check'

          - script: pnpm run lint
            displayName: 'ESLint'
            continueOnError: true

# ── Stage 2: Prepare Apps ─────────────────────────────────────────────────────
  - stage: PrepareApps
    displayName: 'Download & Upload Apps'
    dependsOn: Setup
    condition: and(succeeded(), eq('${{ parameters.skipAppPrep }}', false))
    jobs:
      - ${{ if or(eq(parameters.platform, 'android'), eq(parameters.platform, 'both')) }}:
        - job: PrepareAndroid
          displayName: 'Prepare Android APK'
          pool:
            vmImage: 'ubuntu-latest'
          steps:
            - task: NodeTool@0
              inputs:
                versionSpec: $(NODE_VERSION)

            - script: npm install -g pnpm@$(PNPM_VERSION) && pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              displayName: 'Install pnpm'

            - task: Cache@2
              inputs:
                key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
                restoreKeys: |
                  pnpm | "$(Agent.OS)"
                path: $(Pipeline.Workspace)/.pnpm-store
              displayName: 'Cache pnpm store'

            - script: pnpm install --frozen-lockfile
              displayName: 'Install deps'

            - task: DownloadSecureFile@1
              name: firebaseServiceAccount
              displayName: 'Download Firebase service account'
              inputs:
                secureFile: 'firebase-service-account.json'

            - script: |
                cp $(firebaseServiceAccount.secureFilePath) service-account.json
                pnpm run download:firebase:android
              displayName: 'Download Android APK from Firebase'
              env:
                FIREBASE_PROJECT_ID: $(FIREBASE_PROJECT_ID)
                FIREBASE_APP_ID_ANDROID: $(FIREBASE_APP_ID_ANDROID)

            - script: pnpm run upload:testmu:android
              displayName: 'Upload Android APK to TestMu'
              env:
                LT_USERNAME: $(LT_USERNAME)
                LT_ACCESS_KEY: $(LT_ACCESS_KEY)

            - script: |
                APP_URL=$(cat .testmu-app-url-android)
                echo "##vso[task.setvariable variable=TESTMU_APP_URL_ANDROID;isOutput=true]$APP_URL"
                echo "Android app URL: $APP_URL"
              name: SetAndroidAppUrl
              displayName: 'Export Android app URL'

      - ${{ if or(eq(parameters.platform, 'ios'), eq(parameters.platform, 'both')) }}:
        - job: PrepareiOS
          displayName: 'Prepare iOS IPA'
          pool:
            vmImage: 'macOS-latest'
          steps:
            - task: NodeTool@0
              inputs:
                versionSpec: $(NODE_VERSION)

            - script: npm install -g pnpm@$(PNPM_VERSION) && pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              displayName: 'Install pnpm'

            - task: Cache@2
              inputs:
                key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
                restoreKeys: |
                  pnpm | "$(Agent.OS)"
                path: $(Pipeline.Workspace)/.pnpm-store
              displayName: 'Cache pnpm store'

            - script: pnpm install --frozen-lockfile
              displayName: 'Install deps'

            - task: DownloadSecureFile@1
              name: firebaseServiceAccount
              displayName: 'Download Firebase service account'
              inputs:
                secureFile: 'firebase-service-account.json'

            - script: |
                cp $(firebaseServiceAccount.secureFilePath) service-account.json
                pnpm run download:firebase:ios
              displayName: 'Download iOS IPA from Firebase'
              env:
                FIREBASE_PROJECT_ID: $(FIREBASE_PROJECT_ID)
                FIREBASE_APP_ID_IOS: $(FIREBASE_APP_ID_IOS)

            - script: pnpm run upload:testmu:ios
              displayName: 'Upload iOS IPA to TestMu'
              env:
                LT_USERNAME: $(LT_USERNAME)
                LT_ACCESS_KEY: $(LT_ACCESS_KEY)

            - script: |
                APP_URL=$(cat .testmu-app-url-ios)
                echo "##vso[task.setvariable variable=TESTMU_APP_URL_IOS;isOutput=true]$APP_URL"
                echo "iOS app URL: $APP_URL"
              name: SetiOSAppUrl
              displayName: 'Export iOS app URL'

# ── Stage 3: Android Tests ────────────────────────────────────────────────────
  - stage: TestAndroid
    displayName: 'Android Tests on TestMu'
    dependsOn:
      - Setup
      - PrepareApps
    condition: |
      and(
        in(dependencies.Setup.result, 'Succeeded'),
        in(dependencies.PrepareApps.result, 'Succeeded', 'Skipped'),
        or(
          eq('${{ parameters.platform }}', 'android'),
          eq('${{ parameters.platform }}', 'both')
        )
      )
    variables:
      TESTMU_APP_URL_ANDROID: $[ stageDependencies.PrepareApps.PrepareAndroid.outputs['SetAndroidAppUrl.TESTMU_APP_URL_ANDROID'] ]
    jobs:
      - job: RunAndroidTests
        displayName: 'Run Android Tests'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm install -g pnpm@$(PNPM_VERSION) && pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Install pnpm'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Cache pnpm store'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install deps'

          - script: mkdir -p allure-results
            displayName: 'Create allure-results dir'

          - script: pnpm run test:android:testmu
            displayName: 'Run Android tests on TestMu'
            continueOnError: true
            env:
              LT_USERNAME: $(LT_USERNAME)
              LT_ACCESS_KEY: $(LT_ACCESS_KEY)
              TESTMU_APP_URL_ANDROID: $(TESTMU_APP_URL_ANDROID)
              BUILD_NAME: $(BUILD_NAME)
              BUILD_NUMBER: $(Build.BuildNumber)
              SUITE_NAME: Mobile-Android-${{ parameters.suite }}
              TESTMU_ANDROID_DEVICE: $(TESTMU_ANDROID_DEVICE)
              TESTMU_ANDROID_VERSION: $(TESTMU_ANDROID_VERSION)
              TEST_USERNAME: $(TEST_USERNAME)
              TEST_PASSWORD: $(TEST_PASSWORD)

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/*.xml'
              testRunTitle: 'Android Tests — $(Build.BuildNumber)'
            displayName: 'Publish JUnit results'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/allure-results'
              artifact: 'allure-results-android'
              publishLocation: 'pipeline'
            displayName: 'Publish Allure results artifact'

# ── Stage 4: iOS Tests ────────────────────────────────────────────────────────
  - stage: TestiOS
    displayName: 'iOS Tests on TestMu'
    dependsOn:
      - Setup
      - PrepareApps
    condition: |
      and(
        in(dependencies.Setup.result, 'Succeeded'),
        in(dependencies.PrepareApps.result, 'Succeeded', 'Skipped'),
        or(
          eq('${{ parameters.platform }}', 'ios'),
          eq('${{ parameters.platform }}', 'both')
        )
      )
    variables:
      TESTMU_APP_URL_IOS: $[ stageDependencies.PrepareApps.PrepareiOS.outputs['SetiOSAppUrl.TESTMU_APP_URL_IOS'] ]
    jobs:
      - job: RuniOSTests
        displayName: 'Run iOS Tests'
        pool:
          vmImage: 'macOS-latest'
        timeoutInMinutes: 60
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm install -g pnpm@$(PNPM_VERSION) && pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Install pnpm'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Cache pnpm store'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install deps'

          - script: mkdir -p allure-results
            displayName: 'Create allure-results dir'

          - script: pnpm run test:ios:testmu
            displayName: 'Run iOS tests on TestMu'
            continueOnError: true
            env:
              LT_USERNAME: $(LT_USERNAME)
              LT_ACCESS_KEY: $(LT_ACCESS_KEY)
              TESTMU_APP_URL_IOS: $(TESTMU_APP_URL_IOS)
              BUILD_NAME: $(BUILD_NAME)
              BUILD_NUMBER: $(Build.BuildNumber)
              SUITE_NAME: Mobile-iOS-${{ parameters.suite }}
              TESTMU_IOS_DEVICE: $(TESTMU_IOS_DEVICE)
              TESTMU_IOS_VERSION: $(TESTMU_IOS_VERSION)
              TEST_USERNAME: $(TEST_USERNAME)
              TEST_PASSWORD: $(TEST_PASSWORD)

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/*.xml'
              testRunTitle: 'iOS Tests — $(Build.BuildNumber)'
            displayName: 'Publish JUnit results'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/allure-results'
              artifact: 'allure-results-ios'
              publishLocation: 'pipeline'
            displayName: 'Publish Allure results artifact'

# ── Stage 5: Allure Report ────────────────────────────────────────────────────
  - stage: Report
    displayName: 'Generate & Publish Allure Report'
    dependsOn:
      - TestAndroid
      - TestiOS
    condition: always()
    jobs:
      - job: GenerateReport
        displayName: 'Allure Report'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm install -g pnpm@$(PNPM_VERSION) && pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Install pnpm'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store
            displayName: 'Cache pnpm store'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install deps'

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'allure-results-android'
              targetPath: '$(Build.SourcesDirectory)/allure-results'
            continueOnError: true
            displayName: 'Download Android Allure results'

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'allure-results-ios'
              targetPath: '$(Build.SourcesDirectory)/allure-results'
            continueOnError: true
            displayName: 'Download iOS Allure results'

          - script: |
              pnpm dlx allure-commandline generate allure-results --clean -o $(ALLURE_REPORT_DIR)
            displayName: 'Generate Allure report'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(ALLURE_REPORT_DIR)'
              artifact: 'allure-report'
              publishLocation: 'pipeline'
            displayName: 'Publish Allure HTML report'

          # Optionally deploy to Azure Static Web Apps or Blob Storage
          # - task: AzureStaticWebApp@0
          #   inputs:
          #     workingDirectory: '$(ALLURE_REPORT_DIR)'
          #     azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_TOKEN)
